Plugin.Name="OBS Frame Timing Recorder"
Plugin.Description="Logs when frames were really rendered and read, and saves the log next to each recording and replay for blur."

Probe.Name="Frame Timing Probe"

Warning.NoProbe="A recording was saved, but the frame timing recorder hasn't measured any frames.\n\nAdd the \"Frame Timing Probe\" filter to your Game Capture or Window Capture source (right-click it, Filters, then + under Effect Filters). Until then, blur can't use recordings' timing logs."
Warning.NoPermission="The frame timing recorder doesn't have permission to see when games draw their frames, so recordings get less accurate timing - most noticeable when the game runs at a higher framerate than you record at.\n\nTo fix it, either run OBS as administrator, or add your Windows account to the \"Performance Log Users\" group and sign out and back in. The plugin's README explains how.\n\nEverything else is still logged."
